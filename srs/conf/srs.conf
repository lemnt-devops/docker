listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000;
    # 只用 UDP，TCP 和 UDP 不能同时开（SRS 报 "only support one network"）
    protocol        udp;
    # 候选地址：局域网 IP。公网/跨网段客户端需要 TURN server 才能穿透
    candidate       $CANDIDATE;
    use_auto_detect_network_ip on;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
    }
    # 推流鉴权与状态同步：SRS 回调宿主机上的 Go 后端
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:8081/internal/srs/publish;
        on_unpublish    http://host.docker.internal:8081/internal/srs/unpublish;
    }
}
