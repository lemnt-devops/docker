services:
  postgres:
    image: postgres:18.6-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: lemnt_blog
    volumes:
      - ./data:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: always
    networks:
      - ad-net

networks:
  ad-net:
    external: true